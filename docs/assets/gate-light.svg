<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="Regime gate: the PaAno score always reaches the sum; AxonAD's JEPA term reaches it only when the median of its robust z over the test part exceeds tau = 5, then with weight w = 1." font-family="-apple-system, Segoe UI, Noto Sans, Helvetica, Arial, sans-serif">
<title>Regime gate: the PaAno score always reaches the sum; AxonAD's JEPA term reaches it only when the median of its robust z over the test part exceeds tau = 5, then with weight w = 1.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="arr-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f8b7d"/></marker></defs>
<rect x="20" y="38" width="120" height="44" rx="7" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/><text x="80.0" y="57" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">series x</text><text x="80.0" y="73" text-anchor="middle" font-size="11" fill="#59636e">x[:train_end] normal</text>
<rect x="210" y="38" width="210" height="44" rx="7" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/><text x="315.0" y="57" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">PaAno final</text><text x="315.0" y="73" text-anchor="middle" font-size="11" fill="#59636e">robust-z sum of its terms</text>
<rect x="210" y="153" width="210" height="44" rx="7" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/><text x="315.0" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">AxonAD</text><text x="315.0" y="188" text-anchor="middle" font-size="11" fill="#59636e">JEPA tail distance, robust z</text>
<rect x="720" y="38" width="140" height="44" rx="7" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/><text x="790.0" y="57" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">anomaly score</text><text x="790.0" y="73" text-anchor="middle" font-size="11" fill="#59636e">one per point</text>
<circle cx="640" cy="60" r="17" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/><text x="640" y="65.5" text-anchor="middle" font-size="18" fill="#1f2328">+</text>
<polygon points="530,135 600,175 530,215 460,175" fill="#fff8c5" stroke="#9a6700" stroke-width="1.4"/><text x="530" y="171" text-anchor="middle" font-size="11.5" fill="#1f2328">median z on</text><text x="530" y="186" text-anchor="middle" font-size="11.5" fill="#1f2328">test part &gt; τ ?</text>
<path d="M140,60 H207" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<path d="M80,82 V175 H207" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<path d="M420,60 H620" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<text x="520" y="52" text-anchor="middle" font-size="11" fill="#59636e">always</text>
<path d="M657,60 H717" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<path d="M420,175 H457" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<path d="M600,175 H640 V80" stroke="#0f8b7d" stroke-width="2.2" fill="none" marker-end="url(#arr-acc)"/>
<text x="652" y="122" font-size="11.5" font-weight="600" fill="#0f8b7d">yes: + w · rz(JEPA)</text>
<text x="652" y="138" font-size="11" fill="#59636e">τ = 5, w = 1</text>
<path d="M530,215 V236 H560" stroke="#8c959f" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
<text x="568" y="240" font-size="11" fill="#59636e">no: the term is dropped</text>
</svg>
