[project]
name = "industrial-tsad"
version = "0.1.0"
description = "Time-series analysis and anomaly detection for industrial data: detectors (PaAno, MSCAD, AxonAD, CATCH, KAN-AD, TimesNet), mode-token adapters, score fusion and a reproducible TSB-AD benchmark protocol"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2",
    "pandas>=1.5",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "torch>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
industrial_tsad = ["presets/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
